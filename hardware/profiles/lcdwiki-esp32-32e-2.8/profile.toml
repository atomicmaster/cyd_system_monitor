profile_id = "lcdwiki-esp32-32e-2.8"
vendor = "LCDWiki"
product_family = "E32R28T/E32N28T"
active_variant = "E32R28T"
source_url = "https://www.lcdwiki.com/2.8inch_ESP32-32E_Display"
active_mvp_profile = true

[mcu]
module = "ESP32-WROOM-32E"
chip_observed = "ESP32-D0WD-V3 revision 3.1"
cores = 2
max_frequency_mhz = 240
crystal_mhz = 40
flash_mb = 4

[usb_serial]
family = "CH340/CH341"
vendor_id = 0x1a86
product_id = 0x7523

[display]
controller = "ILI9341V"
width = 240
height = 320
default_orientation = "landscape"
logical_width = 320
logical_height = 240
interface = "spi"
cs = 15
dc = 2
sclk = 14
mosi = 13
miso = 12
reset = "EN"
backlight = 21

[touch]
optional = true
variant = "E32R28T"
required_for_active_variant = true
calibrate_on_first_start = true
calibration_recovery = "on-device settings or USB command"
calibration_targets = 5
calibration_requires_validation = true
controller = "XPT2046"
interface = "spi"
sclk = 25
mosi = 32
miso = 39
cs = 33
irq = 36

[rgb_led]
active_low = true
red = 22
green = 16
blue = 17

[microsd]
interface = "spi"
cs = 5
mosi = 23
sclk = 18
miso = 19

[audio]
amplifier_from_schematic = "SC8002B"
enable = 4
enable_active_low = true
dac = 26
alert_sound_default = false

[battery]
adc = 34

[buttons]
download = 0
reset = "EN"

[uart0]
rx = 3
tx = 1

[expansion_spi]
cs = 27
mosi = 23
sclk = 18
miso = 19

[expansion]
input_only = 35
